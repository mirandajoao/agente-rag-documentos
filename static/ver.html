<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento citado · Converse com os seus documentos</title>
<script>try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.tema = t; } catch (_) {}</script>
<style>
  :root { --bg: #f6f7fb; --card: #ffffff; --ink: #0b1530; --muted: #4a5571; --line: #dce1ea; --brand: #2f5bff; --mark: #e4ff3a; }
  :root[data-tema="escuro"] { --bg: #0b1530; --card: #121e3d; --ink: #eef1f8; --muted: #a9b4cc; --line: #26324f; --brand: #7d97ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) { --bg: #0b1530; --card: #121e3d; --ink: #eef1f8; --muted: #a9b4cc; --line: #26324f; --brand: #7d97ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 15px; margin: 0; flex: 1 1 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  button, .original { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; text-decoration: none; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, .original:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .aviso { margin: 12px 16px 0; font-size: 13px; color: var(--muted); }
  .aviso b { background: var(--mark); color: #0b1530; padding: 0 4px; border-radius: 4px; font-weight: 600; }
  main { padding: 16px; display: flex; justify-content: center; }
  .folha { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(11, 21, 48, .15); border-radius: 4px; max-width: 100%; }
  .folha canvas { display: block; border-radius: 4px; }
  .realce { position: absolute; background: rgba(228, 255, 58, .55); mix-blend-mode: multiply; border-radius: 2px; pointer-events: none; }
  .texto { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; max-width: 760px; width: 100%; white-space: pre-wrap; word-wrap: break-word; }
  mark { background: var(--mark); color: #0b1530; border-radius: 3px; padding: 0 1px; }
  .msg { color: var(--muted); padding: 40px 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Carregando…</h1>
  <div class="nav">
    <button type="button" id="ant" aria-label="Página anterior">‹</button>
    <span id="onde" aria-live="polite"></span>
    <button type="button" id="prox" aria-label="Próxima página">›</button>
  </div>
  <a class="original" id="original" target="_blank" rel="noopener" hidden>Abrir o original ↗</a>
</header>
<p class="aviso" id="aviso" hidden>O trecho usado na resposta está <b>destacado</b>.</p>
<main id="conteudo"><p class="msg">Carregando o documento…</p></main>

<script type="module">
const P = new URLSearchParams(location.search);
const arquivo = P.get('arquivo') || '';
const exemplo = P.get('exemplo') === 'true';
const espaco = P.get('espaco_id') || '';
const trecho = (P.get('trecho') || '').slice(0, 600);
let pagina = Math.max(1, parseInt(P.get('pagina') || '1', 10) || 1);
let paginas = [], pdf = null, pdfjs = null, rotulo = 'Página';
const conteudo = document.getElementById('conteudo');

function base() {
  const q = new URLSearchParams({ arquivo });
  if (exemplo) q.set('exemplo', 'true'); else q.set('espaco_id', espaco);
  return q;
}
document.getElementById('original').href = '/api/documentos/arquivo?' + base() + (arquivo.toLowerCase().endsWith('.pdf') ? '#page=' + pagina : '');
document.getElementById('original').hidden = false;

// ---------- Onde está o trecho no texto (ignora acentos, maiúsculas e quebras de linha) ----------
function normalizar(texto) {
  let s = '', idx = [], espaco = true;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i].normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    if (/\s/.test(c)) { if (!espaco) { s += ' '; idx.push(i); espaco = true; } continue; }
    for (const ch of c) { s += ch; idx.push(i); }
    espaco = false;
  }
  return { s, idx };
}
function faixas(texto, alvo) {
  const T = normalizar(texto), A = normalizar(alvo).s.trim();
  if (!A || !T.s) return [];
  const achar = (frag) => { const p = T.s.indexOf(frag); return p < 0 ? null : [T.idx[p], T.idx[p + frag.length - 1] + 1]; };
  const inteira = achar(A);
  if (inteira) return [inteira];
  // Não achou inteiro (quebra de página, hifenização): destaca pedaços de 6 palavras.
  const pal = A.split(' '), res = [];
  for (let i = 0; i < pal.length; i += 6) {
    const frag = pal.slice(i, i + 6);
    if (frag.length < 3 && i > 0) break;
    const f = achar(frag.join(' '));
    if (f) res.push(f);
  }
  res.sort((a, b) => a[0] - b[0]);
  const juntas = [];
  for (const f of res) {
    const u = juntas[juntas.length - 1];
    if (u && f[0] <= u[1] + 3) u[1] = Math.max(u[1], f[1]); else juntas.push([...f]);
  }
  return juntas;
}

// ---------- Texto (Word, PowerPoint, planilhas, páginas da web ou PDF sem visualização) ----------
function mostrarTexto(texto) {
  const box = document.createElement('div');
  box.className = 'texto';
  let pos = 0;
  for (const [a, b] of trecho ? faixas(texto, trecho) : []) {
    box.append(texto.slice(pos, a));
    const m = document.createElement('mark'); m.textContent = texto.slice(a, b); box.append(m);
    pos = b;
  }
  box.append(texto.slice(pos));
  conteudo.replaceChildren(box);
  const primeiro = box.querySelector('mark');
  document.getElementById('aviso').hidden = !primeiro;
  if (primeiro) primeiro.scrollIntoView({ block: 'center' });
}

// ---------- PDF: a página de verdade, com o trecho destacado por cima ----------
async function abrirPdf() {
  pdfjs = await import('/vendor/pdfjs/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';
  pdf = await pdfjs.getDocument({
    url: '/api/documentos/arquivo?' + base(),
    cMapUrl: '/vendor/pdfjs/cmaps/', cMapPacked: true, standardFontDataUrl: '/vendor/pdfjs/standard_fonts/',
  }).promise;
  paginas = Array.from({ length: pdf.numPages }, (_, i) => i + 1);
}
async function mostrarPdf(n) {
  const pg = await pdf.getPage(n);
  const largura = Math.min(conteudo.clientWidth - 32, 900);
  const vp1 = pg.getViewport({ scale: 1 });
  const vp = pg.getViewport({ scale: Math.max(0.5, largura / vp1.width) });
  const dpr = window.devicePixelRatio || 1;
  const folha = document.createElement('div'); folha.className = 'folha';
  folha.style.width = vp.width + 'px'; folha.style.height = vp.height + 'px';
  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
  canvas.style.width = vp.width + 'px'; canvas.style.height = vp.height + 'px';
  canvas.setAttribute('role', 'img'); canvas.setAttribute('aria-label', 'Página ' + n + ' do documento');
  folha.append(canvas);
  conteudo.replaceChildren(folha);
  await pg.render({ canvasContext: canvas.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;

  let primeiro = null;
  if (trecho) {
    const tc = await pg.getTextContent();
    let texto = ''; const inicios = [];
    for (const it of tc.items) { inicios.push(texto.length); texto += (it.str || '') + (it.hasEOL ? '\n' : ' '); }
    const fx = faixas(texto, trecho);
    tc.items.forEach((it, i) => {
      const a = inicios[i], tam = (it.str || '').length, b = a + tam;
      if (!tam || !it.str.trim()) return;
      for (const [x, y] of fx) {
        if (!(a < y && b > x)) continue;
        // Só a parte da linha que está no trecho (proporcional ao número de letras).
        const ini = (Math.max(a, x) - a) / tam, fim = (Math.min(b, y) - a) / tam;
        const t = pdfjs.Util.transform(vp.transform, it.transform);
        const h = Math.hypot(t[2], t[3]), w = it.width * vp.scale;
        const r = document.createElement('div'); r.className = 'realce';
        r.style.left = (t[4] + ini * w) + 'px'; r.style.top = (t[5] - h * 0.95) + 'px';
        r.style.width = Math.max(4, (fim - ini) * w) + 'px'; r.style.height = (h * 1.15) + 'px';
        folha.append(r);
        if (!primeiro) primeiro = r;
      }
    });
  }
  document.getElementById('aviso').hidden = !primeiro;
  if (primeiro) primeiro.scrollIntoView({ block: 'center' });
}

// ---------- Navegação ----------
function pintarNav() {
  const i = paginas.indexOf(pagina);
  document.getElementById('onde').textContent = rotulo + ' ' + pagina + (paginas.length ? ' de ' + paginas[paginas.length - 1] : '');
  document.getElementById('ant').disabled = i <= 0;
  document.getElementById('prox').disabled = i < 0 || i >= paginas.length - 1;
}
async function ir(n) {
  pagina = n;
  pintarNav();
  try {
    if (pdf) { await mostrarPdf(n); return; }
  } catch (e) { console.warn('Sem visualização do PDF, mostrando o texto', e); pdf = null; }
  const r = await fetch('/api/documentos/pagina?' + base() + '&pagina=' + n);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { conteudo.innerHTML = ''; const p = document.createElement('p'); p.className = 'msg'; p.textContent = d.detail || 'Não foi possível abrir o documento.'; conteudo.append(p); return; }
  if (!pdf) { paginas = d.paginas; pagina = d.pagina; pintarNav(); }
  mostrarTexto(d.texto);
}
document.getElementById('ant').addEventListener('click', () => { const i = paginas.indexOf(pagina); if (i > 0) ir(paginas[i - 1]); });
document.getElementById('prox').addEventListener('click', () => { const i = paginas.indexOf(pagina); if (i < paginas.length - 1) ir(paginas[i + 1]); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') document.getElementById('ant').click();
  if (e.key === 'ArrowRight') document.getElementById('prox').click();
});

(async () => {
  const r = await fetch('/api/documentos/pagina?' + base() + '&pagina=' + pagina);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { document.getElementById('titulo').textContent = 'Documento indisponível'; conteudo.innerHTML = ''; const p = document.createElement('p'); p.className = 'msg'; p.textContent = d.detail || 'Não foi possível abrir o documento.'; conteudo.append(p); return; }
  document.getElementById('titulo').textContent = d.documento;
  document.title = d.documento + ' · página ' + d.pagina;
  rotulo = d.slides ? 'Slide' : 'Página';
  paginas = d.paginas; pagina = d.pagina;
  if (d.pdf) {
    try { await abrirPdf(); } catch (e) { console.warn('PDF.js indisponível, mostrando o texto', e); pdf = null; }
  }
  await ir(pagina);
})();
</script>
</body>
</html>
